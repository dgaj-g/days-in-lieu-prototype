<script>
/* Days in Lieu · api-gas.js — the browser's door to the server. Replaces mock-api.js in the build.
   Every method returns a Promise, exactly as the mock did, so app.js is unchanged. */
window.DIL_API = (function () {
  'use strict';
  var NAMES = ['whoami', 'myName', 'setMyName', 'myDays', 'submitClaim', 'withdrawClaim', 'submit', 'withdraw', 'cancelDay',
               'queue', 'decideClaim', 'decide', 'mailState', 'decided', 'overview', 'csv', 'staffList', 'staffAdd', 'staffRemove', 'staffRole'];
  function call(name, args) {
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(name, args);
    });
  }
  var api = {};
  NAMES.forEach(function (n) { api[n] = function () { return call(n, Array.prototype.slice.call(arguments)); }; });
  return api;
})();
</script>
