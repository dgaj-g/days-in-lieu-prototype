<style>
/* Days in Lieu · style.css — "the school diary": navy & gold shell, calm paper work surfaces. Fable 5.1, 17 Sep 2026 */
:root{
  --navy-900:#0B1B36; --navy-800:#10244A; --navy-700:#16305E; --navy:#1A3A6B; --navy-400:#3B5A8F; --navy-200:#C9D4E6;
  --gold:#E4B824; --gold-deep:#B8901A; --gold-soft:#FBF3D6; --gold-line:rgba(228,184,36,.28);
  --bg:#EEF1F6; --paper:#FFFFFF; --ink:#1B2333; --muted:#5C6677; --faint:#8A94A6; --hair:#DDE3EC; --hair-2:#EBEFF5;
  --ok:#1F8A5B; --ok-soft:#E3F5EC; --wait:#B8901A; --wait-soft:#FBF3D6; --no:#B93A32; --no-soft:#F8E4E2; --taken:#4A5A73; --taken-soft:#E7ECF3; --grey:#7A8494; --grey-soft:#EEF0F3;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(11,27,54,.06),0 10px 28px -14px rgba(11,27,54,.22);
  --display:'Fraunces',Georgia,'Times New Roman',serif; --text:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#E6EBF3 0,var(--bg) 320px)}
a{color:var(--navy);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* ---------- shell ---------- */
.shell{position:relative;background:radial-gradient(900px 260px at 18% 0%,rgba(228,184,36,.20),transparent 60%),linear-gradient(120deg,var(--navy-900),var(--navy-700) 55%,var(--navy) 100%);color:#fff;overflow:hidden}
.shell::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:linear-gradient(var(--gold-line) 1px,transparent 1px),linear-gradient(90deg,var(--gold-line) 1px,transparent 1px);
  background-size:96px 96px;mask-image:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%);-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%)}
.shell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),rgba(228,184,36,.35) 60%,transparent)}
.shell .wrap{position:relative;display:flex;align-items:center;gap:18px;min-height:96px;padding-top:14px;padding-bottom:14px}
.crest{width:60px;height:60px;flex:none;filter:drop-shadow(0 4px 14px rgba(228,184,36,.35))}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-size:30px;line-height:1.05;letter-spacing:-.01em;font-variation-settings:"opsz" 72}
.brand .school{margin-top:4px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.95}
.who{text-align:right;font-size:13px;line-height:1.35;color:rgba(255,255,255,.85);min-width:0}
.who b{display:block;font-weight:600;color:#fff}
.who span{display:block;color:rgba(255,255,255,.65);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.shell .wrap{min-height:80px;gap:12px}.crest{width:46px;height:46px}.brand h1{font-size:24px}.who{display:none}}

/* waiting line — moves while the server is working */
.waitline{height:3px;background:transparent;position:relative;overflow:hidden}
.waitline.on::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slide 1.1s linear infinite}
@keyframes slide{to{left:100%}}

/* nav */
.nav{background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.tab .badge{background:var(--gold);color:var(--navy-900);font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.tab .badge[hidden]{display:none}

main{padding:28px 0 72px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-family:var(--display);font-size:34px;line-height:1.05;font-variation-settings:"opsz" 72;letter-spacing:-.01em}
.page-head .sub{color:var(--muted);margin-top:6px}
.page-head .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:600px){.page-head h2{font-size:28px}}

/* ---------- cards & tiles ---------- */
.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.card+.card{margin-top:16px}
.card h3{font-family:var(--display);font-size:22px;font-variation-settings:"opsz" 40;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 22px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--navy))}
.tile .n{font-family:var(--display);font-size:46px;line-height:1;font-variation-settings:"opsz" 144;font-weight:500;color:var(--c,var(--navy));letter-spacing:-.02em}
.tile .n small{font-size:18px;font-family:var(--text);font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.tile .l{margin-top:8px;font-weight:600;font-size:14px}
.tile .s{color:var(--muted);font-size:13px}
.tile.ok{--c:var(--ok)} .tile.taken{--c:var(--taken)} .tile.wait{--c:var(--wait)} .tile.no{--c:var(--no)} .tile.navy{--c:var(--navy)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--grey-soft);color:var(--grey)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.pending{background:var(--wait-soft);color:var(--wait)} .chip.approved{background:var(--ok-soft);color:var(--ok)} .chip.declined{background:var(--no-soft);color:var(--no)}
.chip.partly{background:var(--wait-soft);color:#8A6A0C} .chip.taken{background:var(--taken-soft);color:var(--taken)} .chip.withdrawn,.chip.cancelled{background:var(--grey-soft);color:var(--grey)}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--hair-2);flex-wrap:wrap}
.rows .why{flex-basis:100%;font-size:13.5px;color:#8A2E28;background:var(--no-soft);padding:6px 10px;border-radius:var(--radius-s);white-space:pre-wrap}
.rows .why b{font-weight:600;margin-right:6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.rows li.daynote{display:block;border-top:0;padding:0 0 12px}
.rows li.daynote label.f{margin-top:0}
.rows li.daynote textarea{min-height:64px}
.door input{max-width:360px}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkish:hover{color:var(--navy-900)}
.name-edit{padding:16px 18px;margin:-4px 0 16px}
.name-edit .name-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.name-edit .name-row input{flex:1 1 220px;max-width:360px}
.table td.acts{white-space:nowrap}
.rows li.daynote.same{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;padding:0 0 12px;font-size:13.5px;color:var(--muted)}
.instead-line{margin:-2px 0 10px;padding:8px 12px;background:var(--gold-soft);border-radius:var(--radius-s);color:#5C4A0A;font-size:14px}
.instead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;background:var(--gold-soft);border-radius:var(--radius-s);color:#5C4A0A;font-size:14px}
.instead .link{margin-left:auto;white-space:nowrap}
.rows li:first-child{border-top:0}
.rows .d{font-weight:600;min-width:150px}
.rows .p{color:var(--muted)}
.rows .grow{flex:1}
.rows .who{text-align:left;color:var(--ink);font-size:15px}
.empty{color:var(--muted);padding:6px 0}
.muted{color:var(--muted)} .small{font-size:13.5px}
.reason{margin:10px 0 0;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);border-radius:0 var(--radius-s) var(--radius-s) 0;white-space:pre-wrap}
.reason b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.note{margin-top:10px;padding:10px 14px;background:var(--gold-soft);border-radius:var(--radius-s);white-space:pre-wrap}
.note b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8A6A0C;margin-bottom:2px}
.req{padding:18px 22px}
.req .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.req .top .t{font-family:var(--display);font-size:21px;font-variation-settings:"opsz" 40}
.req .top .m{color:var(--muted);font-size:14px}
.req .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

@media (max-width:600px){
  .rows li{flex-wrap:wrap;gap:6px 10px}
  .rows .d,.picked-list .d{min-width:0;flex-basis:100%}
  .rows .grow{flex:0 0 0}
  .rows li>.chip,.rows li>.btn,.rows li>.seg,.rows li>.x{margin-left:auto}
  .rows li>.p+.chip,.rows li>.p+.seg{margin-left:auto}
  .seg button{padding:6px 9px;font-size:12.5px}
  .req{padding:16px}
  .card{padding:18px 16px}
  .tile .n{font-size:38px}
  .qcard .name{font-size:21px}
  .bars{gap:4px;height:130px}
  .bars .col .l{font-size:10px}
  .bars .col .v{font-size:10.5px}
  .table th,.table td{padding:8px 6px;font-size:13.5px}
  .typed{flex-wrap:wrap}
  .typed input{flex-basis:100%}
}

/* ---------- buttons & forms ---------- */
.btn{appearance:none;border:1px solid transparent;border-radius:11px;padding:11px 18px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:9px;line-height:1.2;transition:transform .08s,background .15s,box-shadow .15s;background:var(--paper);border-color:var(--hair);color:var(--navy)}
.btn:hover{background:#F6F8FB}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.cal button:focus-visible{outline:3px solid rgba(228,184,36,.6);outline-offset:2px}
.btn.primary{background:var(--gold);color:var(--navy-900);border-color:var(--gold);box-shadow:0 6px 18px -8px rgba(184,144,26,.7)}
.btn.primary:hover{background:#EBC23A}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.navy:hover{background:var(--navy-700)}
.btn.danger{color:var(--no);border-color:#EBC7C4}
.btn.danger:hover{background:var(--no-soft)}
.btn.quiet{border-color:transparent;background:transparent;padding-left:8px;padding-right:8px}
.btn.quiet:hover{background:var(--hair-2)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.lg{padding:14px 22px;font-size:16px}
.btn[disabled]{opacity:.55;cursor:default;transform:none}
.btn.is-busy{cursor:progress;opacity:1}
.btn.is-busy .dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1.15);opacity:1}}
.link{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:14px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.f:first-child{margin-top:0}
input[type=text],input[type=email],textarea,select{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--hair);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
select{width:auto;padding-right:32px}
.help{margin-top:8px;font-size:13.5px;color:var(--muted);min-height:20px}
.help.bad{color:var(--no)} .help.good{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:3px;background:var(--bg);gap:2px}
.seg button{appearance:none;border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.seg.decide button.on.no{background:var(--no)} .seg.decide button.on.ok{background:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chips .lbl{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chips button{appearance:none;border:1px solid var(--hair);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--navy)}
.chips button:hover{background:var(--gold-soft);border-color:var(--gold)}
.confirm{margin-top:12px;padding:12px 14px;border:1px solid var(--hair);border-radius:var(--radius-s);background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm span{flex:1;min-width:200px}
.inline-msg{margin-top:10px;font-size:14px}
.inline-msg.bad{color:var(--no)} .inline-msg.good{color:var(--ok)}
.done-line{display:flex;align-items:center;gap:10px;padding:16px 22px;color:var(--ok);font-weight:600;background:var(--ok-soft);border-radius:var(--radius)}

/* ---------- new request layout ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:16px}
.step{display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:22px;font-variation-settings:"opsz" 40;margin-bottom:6px}
.step small{font-family:var(--text);font-size:13.5px;color:var(--muted)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.cal-head b{font-family:var(--display);font-size:19px;font-weight:500;font-variation-settings:"opsz" 40}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:4px 0 6px}
.cal button{appearance:none;border:1px solid transparent;background:#fff;border-radius:10px;height:44px;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);position:relative}
.cal button:hover{background:var(--gold-soft);border-color:var(--gold)}
.cal button.off{color:var(--faint);background:var(--bg);cursor:not-allowed;font-weight:400}
.cal button.off:hover{background:var(--bg);border-color:transparent}
.cal button.closed{background:repeating-linear-gradient(135deg,#F1F3F7 0 6px,#E9EDF3 6px 12px)}
.cal button.mine{color:var(--ok);background:var(--ok-soft);cursor:not-allowed}
.cal button.mine:hover{border-color:transparent}
.cal button.other{visibility:hidden}
.cal button.today{box-shadow:inset 0 0 0 2px var(--gold)}
.cal button.picked{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.cal button.picked:hover{background:var(--navy-700)}
.cal button.picked.half::after{content:"½";position:absolute;right:5px;top:3px;font-size:10px;color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.picked-list li{flex-wrap:wrap}
.picked-list .d{min-width:140px}
.picked-list .x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.picked-list .x:hover{background:var(--no-soft);color:var(--no)}
.total{font-family:var(--display);font-size:24px;font-variation-settings:"opsz" 40;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair-2)}
.total.zero{color:var(--muted);font-size:16px;font-family:var(--text)}
.summary .rows li{padding:8px 0}
.summary .rows .d{min-width:0;flex:1}
.summary .total{border-top:1px solid var(--hair)}
.summary .reason{margin-top:12px;font-size:14px}
.typed{display:flex;gap:8px;align-items:center}
.typed input{flex:1}

/* ---------- queue ---------- */
.qcard .name{font-family:var(--display);font-size:24px;font-variation-settings:"opsz" 40}
.qcard .meta{color:var(--muted);font-size:14px;margin-top:2px}
.qcard .rows li{gap:12px}
.qcard .yr{font-size:13.5px;color:var(--muted);margin-top:8px}
.qcard .foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.qcard.leaving{animation:leave .45s ease forwards}
@keyframes leave{to{opacity:0;transform:translateY(-8px);max-height:0;padding-top:0;padding-bottom:0;margin:0}}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{appearance:none;border:1px solid var(--hair);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- overview ---------- */
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:160px;margin-top:6px;padding-top:6px}
.bars .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0;position:relative}
.bars .col .v{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px;font-variant-numeric:tabular-nums}
.bars .col .b{background:var(--navy);border-radius:5px 5px 0 0;min-height:2px}
.bars .col .b.p{background:var(--gold);border-radius:0;opacity:.85}
.bars .col .b.p+.b{border-radius:0 0 0 0}
.bars .col .l{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.04em}
.bars .col.now .l{color:var(--navy);font-weight:700}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--hair);font-weight:600}
.table th:first-child,.table td:first-child{text-align:left}
.table td{padding:10px;border-bottom:1px solid var(--hair-2);text-align:right}
.table td.z{color:var(--faint)}
.table tr.total td{font-weight:700;border-top:2px solid var(--hair);border-bottom:0}
.table-wrap{overflow-x:auto}
.staff-form{display:grid;grid-template-columns:1.2fr 1.4fr .8fr auto;gap:12px;align-items:end}
@media (max-width:800px){.staff-form{grid-template-columns:1fr}}
.staff-form label.f{margin-top:0}

/* ---------- doors, toast, skeleton ---------- */
.door{max-width:560px;margin:56px auto 0;text-align:center;padding:36px 30px}
.door h2{font-family:var(--display);font-size:30px;font-variation-settings:"opsz" 72;margin-bottom:12px}
.door p{color:var(--muted);margin:0 0 10px}
.door .btn{margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--navy-900);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);display:flex;gap:12px;align-items:center;max-width:min(560px,calc(100vw - 32px));transition:.25s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast{pointer-events:none} /* a toast only tells; it must never sit over a button and take the tap (sweep found this on the phone) */
.toast.bad{background:var(--no)}
.toast .i{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy-900);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.toast.bad .i{background:#fff;color:var(--no)}
.skel{background:linear-gradient(90deg,#E9EDF3 25%,#F4F6FA 50%,#E9EDF3 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px;height:16px}
@keyframes shimmer{to{background-position:-200% 0}}
.skel.big{height:46px;width:40%}.skel.line{width:70%;margin-top:10px}
.loading-card{padding:22px}

/* prototype-only dev bar */

/* staff list on a phone: one block per person, actions under the name (the Principal must see the buttons without scrolling sideways) */

  .table.staff thead{display:none}
